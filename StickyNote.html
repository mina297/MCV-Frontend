<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sticky Notes</title>
  <link rel="stylesheet" href="StickyNote.css" />
</head>
<body>
  <main class="board">
    <header class="board-header">
      <h1>My Sticky Notes</h1>
    </header>

    <section class="notes-area" aria-label="Sticky notes">
      <article class="note note-1" aria-label="Note 1"></article>
      <article class="note note-2" aria-label="Meeting note">
        <p>Mina</p>
      </article>
      <article class="note note-3" aria-label="Bug note">
        <p>Mark</p>
      </article>
    </section>

    <button class="help-btn" type="button">Help</button>
  </main>
</body>
</html>
