<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="page">
    <section class="profile-card" aria-label="Profile card">
      <div class="photo-frame">
        <img
          src="/20250524_144518.jpg"
          alt="Profile photo"
          class="profile-photo"
        />
      </div>

      <div class="content">
        <h1>Mina Elkomos Samaan</h1>
        <p class="role">Full Stack Developer</p>

        <div class="skills" aria-label="Skills">
          <span>HTML</span>
          <span>CSS</span>
          <span>JavaScript</span>
          <span>React</span>
          <span>Python</span>
          <span>Node.js</span>
          <span>Express.js</span>
          <span>Java</span>
          <span>MongoDB</span>
          <span>MySQL</span>
          <span>Git</span>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
